name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.8 を用意する
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: 依存を入れる (pin をそのまま使う)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: vcan を用意する
        run: |
          sudo modprobe vcan
          bash scripts/setup_vcan.sh vcan0

      - name: 残骸プロセスが無いことを確認する
        run: |
          if pgrep -af 'omsim.apps'; then
            echo "omsim のプロセスが残っています" >&2
            exit 1
          fi

      - name: テスト (skip が出たら失敗させる)
        run: |
          python -m pytest -q -rs --strict-markers | tee pytest.log
          if grep -qE "[0-9]+ skipped" pytest.log; then
            echo "skip されたテストがあります。vcan が使えていない可能性があります" >&2
            exit 1
          fi

      - name: 網羅率を出す
        run: python -m omsim.apps.omsim_main --coverage | head -5

      - name: シナリオを流してレポートを作る
        run: |
          python -m omsim.apps.omsim_main --node 1 --node 2 --record rec.jsonl --duration 20 &
          sleep 3
          python -m omsim.apps.scenario tests/scenarios/two_nodes_pv.yaml \
            --junit junit.xml --report report.html --record-path rec.jsonl
          wait

      - name: 成果物を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-report
          path: |
            report.html
            junit.xml
            rec.jsonl
